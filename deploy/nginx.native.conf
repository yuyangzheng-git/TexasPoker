# Host Nginx deployment for 101.35.6.63; leaves other sites on their own ports.
map $http_upgrade $texaspoker_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=texaspoker_create:10m rate=6r/m;

server {
    listen 3001;
    server_name 101.35.6.63;
    root /opt/texaspoker/current/frontend/build;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/games {
        limit_req zone=texaspoker_create burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18001;
        include /etc/nginx/snippets/texaspoker-proxy.conf;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18001;
        include /etc/nginx/snippets/texaspoker-proxy.conf;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:18001;
        include /etc/nginx/snippets/texaspoker-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $texaspoker_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
